name: Rust examples
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Compile and test all teaching examples
        run: cargo test --all-targets
      - name: Verify catalog files, Cargo targets, and Markdown links
        run: python3 tools/verify_catalog.py
      - name: Check static viewer JavaScript
        run: node tools/verify_site.mjs
      - name: Formatting audit (nonblocking until normalized)
        continue-on-error: true
        run: cargo fmt --all -- --check
      - name: Lint audit (nonblocking until normalized)
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings
